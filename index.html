<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Alquileres</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#172033}
.header{background:linear-gradient(135deg,#0757a5,#0b75d1);color:white;padding:22px;border-radius:0 0 24px 24px}
.header h1{margin:0;font-size:22px}
.header small{opacity:.85}
.container{max-width:650px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:white;border-radius:15px;padding:14px 5px;text-align:center;box-shadow:0 3px 12px #00000012}
.stat strong{display:block;font-size:22px;color:#0757a5}
.stat span{font-size:12px;color:#667085}
h2{font-size:18px}
.alerts{background:#fff7f7;border:1px solid #ffd2d2;border-radius:18px;padding:15px}
.alert{padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.alert:last-child{border:0}
button{cursor:pointer}
.primary{width:100%;border:0;background:#0875d1;color:white;padding:14px;border-radius:11px;font-size:15px;font-weight:bold;margin:15px 0}
.secondary{width:100%;border:1px solid #0875d1;background:white;color:#0875d1;padding:12px;border-radius:10px;font-weight:bold;margin-top:10px}
.property{background:white;border-radius:16px;padding:14px;margin-bottom:11px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 9px #0000000f;cursor:pointer}
.icon{width:52px;height:52px;background:#e9f3ff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px}
.info{flex:1}
.info strong,.info small{display:block}
.info small{color:#667085;margin-top:3px}
.status{display:inline-block;margin-top:6px;padding:4px 8px;background:#d9f8e7;color:#16804a;border-radius:20px;font-size:11px;font-weight:bold}
.price{font-weight:bold;text-align:right}
.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;z-index:100;overflow:auto}
.box{background:white;max-width:550px;margin:20px auto;padding:22px;border-radius:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;width:36px;height:36px;border-radius:50%;font-size:20px}
label{display:block;margin-top:13px;font-size:13px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #d8dde5;border-radius:10px;font-size:15px}
.row{padding:11px 0;border-bottom:1px solid #eee}
.row small{display:block;color:#667085;margin-bottom:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.actions button{border:0;padding:12px;border-radius:10px;font-weight:bold}
.blue{background:#0875d1;color:white}
.grey{background:#edf0f4;color:#344054}
.green{background:#daf8e7;color:#157347}
.red{background:#fff0f0;color:#c62828}
.payment{background:#f7f9fc;border-radius:12px;padding:12px;margin:9px 0}
.payment-top{display:flex;justify-content:space-between;gap:10px}
.paid{color:#16804a;font-weight:bold}
.pending{color:#d92d20;font-weight:bold}
.empty{text-align:center;padding:25px;color:#667085}
</style>
</head>

<body>

<header class="header">
<h1>🏠 Mis Alquileres</h1>
<small>Gestión de propiedades</small>
</header>

<main class="container">

<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Propiedades</span></div>
<div class="stat"><strong id="alquiladas">0</strong><span>En alquiler</span></div>
<div class="stat"><strong id="pendientes">0</strong><span>Pagos pendientes</span></div>
</div>

<h2>🔔 Alertas</h2>
<div class="alerts">
<div class="alert">📈 Revisar próximos aumentos por IPC</div>
<div class="alert">📄 Revisar contratos próximos a vencer</div>
<div class="alert" id="alertaPagos">💰 Sin pagos pendientes</div>
</div>

<button class="primary" onclick="nuevaPropiedad()">＋ Agregar propiedad</button>

<h2>Mis propiedades</h2>
<div id="lista"></div>

</main>

<!-- PROPIEDAD -->
<div class="modal" id="modalPropiedad">
<div class="box">
<div class="modal-head">
<h2 id="tituloFormulario">Nueva propiedad</h2>
<button class="close" onclick="cerrar('modalPropiedad')">×</button>
</div>

<label>Dirección</label><input id="direccion">
<label>Unidad / Piso</label><input id="unidad">
<label>Localidad</label><input id="localidad">

<label>Estado</label>
<select id="estado">
<option>En alquiler</option>
<option>Disponible</option>
</select>

<label>Inquilino</label><input id="inquilino">
<label>Teléfono</label><input id="telefono">
<label>Email</label><input id="email" type="email">
<label>Alquiler mensual</label><input id="alquiler" type="number">
<label>Inicio del contrato</label><input id="inicioContrato" type="date">
<label>Fin del contrato</label><input id="finContrato" type="date">
<label>Próximo aumento</label><input id="proximoAumento" type="date">
<label>N° cliente Edesur</label><input id="edesur">
<label>N° cliente MetroGAS</label><input id="metrogas">

<button class="primary" onclick="guardarPropiedad()">Guardar propiedad</button>
</div>
</div>

<!-- DETALLE -->
<div class="modal" id="modalDetalle">
<div class="box">
<div class="modal-head">
<h2>Detalle de propiedad</h2>
<button class="close" onclick="cerrar('modalDetalle')">×</button>
</div>

<div id="detalle"></div>

<button class="secondary" onclick="editarPropiedad()">✏️ Editar propiedad</button>
<button class="primary" onclick="abrirPago()">＋ Registrar pago</button>

<h2>Historial de pagos</h2>
<div id="historial"></div>

<div class="actions">
<button class="blue" onclick="facturacion(true)">🧾 Facturar</button>
<button class="grey" onclick="facturacion(false)">No facturar</button>
</div>

<div class="actions">
<button class="red" onclick="eliminarPropiedad()">Eliminar propiedad</button>
<button class="grey" onclick="cerrar('modalDetalle')">Cerrar</button>
</div>

</div>
</div>

<!-- PAGO -->
<div class="modal" id="modalPago">
<div class="box">
<div class="modal-head">
<h2>Registrar pago</h2>
<button class="close" onclick="cerrar('modalPago')">×</button>
</div>

<label>Mes</label>
<input id="mesPago" type="month">

<label>Importe</label>
<input id="importePago" type="number">

<label>Fecha de pago</label>
<input id="fechaPago" type="date">

<label>Estado</label>
<select id="estadoPago">
<option>Pagado</option>
<option>Pendiente</option>
</select>

<button class="primary" onclick="guardarPago()">Guardar pago</button>
</div>
</div>

<script>

let propiedades=JSON.parse(localStorage.getItem("misAlquileresPropiedades"))||[];
let seleccion=null;
let editando=null;

propiedades.forEach(p=>{
 if(!p.pagos) p.pagos=[];
});

function guardar(){
 localStorage.setItem("misAlquileresPropiedades",JSON.stringify(propiedades));
}

function abrir(id){document.getElementById(id).style.display="block"}
function cerrar(id){document.getElementById(id).style.display="none"}

function nuevaPropiedad(){
 editando=null;
 limpiar();
 document.getElementById("tituloFormulario").innerText="Nueva propiedad";
 abrir("modalPropiedad");
}

function limpiar(){
 document.querySelectorAll("#modalPropiedad input").forEach(x=>x.value="");
 document.getElementById("estado").value="En alquiler";
}

function datosFormulario(){
 return{
 direccion:direccion.value.trim(),
 unidad:unidad.value.trim(),
 localidad:localidad.value.trim(),
 estado:estado.value,
 inquilino:inquilino.value.trim(),
 telefono:telefono.value.trim(),
 email:email.value.trim(),
 alquiler:alquiler.value,
 inicioContrato:inicioContrato.value,
 finContrato:finContrato.value,
 proximoAumento:proximoAumento.value,
 edesur:edesur.value.trim(),
 metrogas:metrogas.value.trim()
 };
}

function guardarPropiedad(){
 const d=datosFormulario();

 if(!d.direccion||!d.localidad){
   alert("Completá dirección y localidad.");
   return;
 }

 if(editando===null){
   d.facturar=false;
   d.pagos=[];
   propiedades.push(d);
 }else{
   d.facturar=propiedades[editando].facturar||false;
   d.pagos=propiedades[editando].pagos||[];
   propiedades[editando]=d;
 }

 guardar();
 cerrar("modalPropiedad");
 mostrar();

 if(editando!==null){
   seleccion=editando;
   abrirDetalle(seleccion);
 }
}

function mostrar(){
 lista.innerHTML="";

 if(!propiedades.length){
   lista.innerHTML='<div class="empty">Todavía no hay propiedades.</div>';
 }

 propiedades.forEach((p,i)=>{
   const e=document.createElement("div");
   e.className="property";

   e.innerHTML=`
   <div class="icon">🏢</div>
   <div class="info">
   <strong>${esc(p.direccion)} ${p.unidad?"- "+esc(p.unidad):""}</strong>
   <small>${esc(p.localidad)}</small>
   <small>${esc(p.inquilino||"Sin inquilino")}</small>
   <span class="status">${esc(p.estado)}</span>
   </div>
   <div class="price">${p.alquiler?"$"+Number(p.alquiler).toLocaleString("es-AR"):"—"}</div>
   `;

   e.onclick=()=>abrirDetalle(i);
   lista.appendChild(e);
 });

 actualizar();
}

function abrirDetalle(i){
 seleccion=i;
 const p=propiedades[i];

 detalle.innerHTML=`
 <div class="row"><small>Propiedad</small><strong>${esc(p.direccion)} ${p.unidad?"- "+esc(p.unidad):""}</strong></div>
 <div class="row"><small>Localidad</small><strong>${esc(p.localidad)}</strong></div>
 <div class="row"><small>Estado</small><strong>${esc(p.estado)}</strong></div>
 <div class="row"><small>Inquilino</small><strong>${esc(p.inquilino||"—")}</strong></div>
 <div class="row"><small>Teléfono</small><strong>${esc(p.telefono||"—")}</strong></div>
 <div class="row"><small>Email</small><strong>${esc(p.email||"—")}</strong></div>
 <div class="row"><small>Alquiler</small><strong>${p.alquiler?"$"+Number(p.alquiler).toLocaleString("es-AR"):"—"}</strong></div>
 <div class="row"><small>Contrato</small><strong>${esc(p.inicioContrato||"—")} → ${esc(p.finContrato||"—")}</strong></div>
 <div class="row"><small>Próximo aumento</small><strong>${esc(p.proximoAumento||"—")}</strong></div>
 <div class="row"><small>Edesur</small><strong>${esc(p.edesur||"—")}</strong></div>
 <div class="row"><small>MetroGAS</small><strong>${esc(p.metrogas||"—")}</strong></div>
 <div class="row"><small>Facturación</small><strong>${p.facturar?"🧾 Facturar":"No facturar"}</strong></div>
 `;

 mostrarPagos();
 abrir("modalDetalle");
}

function editarPropiedad(){
 const p=propiedades[seleccion];
 editando=seleccion;

 ["direccion","unidad","localidad","estado","inquilino","telefono","email",
 "alquiler","inicioContrato","finContrato","proximoAumento","edesur","metrogas"]
 .forEach(k=>document.getElementById(k).value=p[k]||"");

 document.getElementById("tituloFormulario").innerText="Editar propiedad";
 cerrar("modalDetalle");
 abrir("modalPropiedad");
}

function abrirPago(){
 mesPago.value="";
 importePago.value=propiedades[seleccion].alquiler||"";
 fechaPago.value="";
 estadoPago.value="Pagado";
 abrir("modalPago");
}

function guardarPago(){
 if(!mesPago.value||!importePago.value){
   alert("Completá el mes y el importe.");
   return;
 }

 propiedades[seleccion].pagos.push({
   mes:mesPago.value,
   importe:importePago.value,
   fecha:fechaPago.value,
   estado:estadoPago.value
 });

 guardar();
 cerrar("modalPago");
 mostrarPagos();
 mostrar();
}

function mostrarPagos(){
 const pagos=propiedades[seleccion].pagos||[];
 historial.innerHTML="";

 if(!pagos.length){
   historial.innerHTML='<div class="empty">Todavía no hay pagos registrados.</div>';
   return;
 }

 [...pagos].reverse().forEach(p=>{
   historial.innerHTML+=`
   <div class="payment">
   <div class="payment-top">
   <strong>${esc(p.mes)}</strong>
   <span class="${p.estado==="Pagado"?"paid":"pending"}">${esc(p.estado)}</span>
   </div>
   <div>$${Number(p.importe).toLocaleString("es-AR")}</div>
   <small>${p.fecha?"Fecha: "+esc(p.fecha):"Sin fecha registrada"}</small>
   </div>`;
 });
}

function facturacion(valor){
 propiedades[seleccion].facturar=valor;
 guardar();
 abrirDetalle(seleccion);
}

function eliminarPropiedad(){
 if(!confirm("¿Seguro que querés eliminar esta propiedad?"))return;
 propiedades.splice(seleccion,1);
 guardar();
 seleccion=null;
 cerrar("modalDetalle");
 mostrar();
}

function actualizar(){
 total.innerText=propiedades.length;
 alquiladas.innerText=propiedades.filter(p=>p.estado==="En alquiler").length;

 const cant=propiedades.reduce((n,p)=>
   n+(p.pagos||[]).filter(x=>x.estado==="Pendiente").length,0);

 pendientes.innerText=cant;

 alertaPagos.innerText=cant
 ?`💰 ${cant} pago${cant===1?"":"s"} pendiente${cant===1?"":"s"}`
 :"💰 Sin pagos pendientes";
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

guardar();
mostrar();

</script>
</body>
</html>
